<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrumentos · MiCRO Automación</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --micro-blue:   #01b2fe;
    --micro-dark:   #0090d0;
    --bg:           #e8f7ff;
    --surface:      #ffffff;
    --border:       #b8e4f9;
    --text:         #0d2b3e;
    --text-soft:    #4a7a95;
    --muted:        #8ab4c8;
    --ok:           #00b96b;
    --warn:         #f59e0b;
    --danger:       #e53e3e;
    --radius:       14px;
    --shadow:       0 4px 24px rgba(1,178,254,.13);
    --font:         "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body {
    background: linear-gradient(160deg, #d0eeff 0%, #f0faff 60%, #e0f5ff 100%);
    min-height: 100vh;
    font-family: var(--font);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
  }
  .header {
    width: 100%;
    background: linear-gradient(135deg, #01b2fe 0%, #0090d0 100%);
    padding: 22px 20px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 20px rgba(1,144,208,.35);
  }
  .logo-wrap img { height: 54px; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
  .header-title { color: #fff; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; opacity: .88; text-align: center; }
  .search-zone { width: 100%; max-width: 580px; padding: 0 16px; margin-top: -18px; }
  .search-box {
    background: var(--surface);
    border-radius: 40px;
    box-shadow: 0 6px 28px rgba(1,178,254,.22);
    display: flex; align-items: center;
    padding: 0 18px; gap: 10px;
    border: 2px solid transparent;
    transition: border-color .2s;
  }
  .search-box:focus-within { border-color: var(--micro-blue); }
  .search-icon { font-size: 18px; color: var(--micro-blue); flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none;
    font-size: 16px; font-family: var(--font);
    color: var(--text); padding: 16px 0; background: transparent;
  }
  .search-box input::placeholder { color: var(--muted); }
  .main { width: 100%; max-width: 580px; padding: 20px 16px 0; }
  .msg { text-align: center; padding: 44px 20px; color: var(--text-soft); }
  .msg .icon { font-size: 40px; margin-bottom: 12px; }
  .msg strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .msg p { font-size: 13px; line-height: 1.6; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--micro-blue);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
    border: 1.5px solid var(--border); transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(1,178,254,.2); }
  .card-stripe { height: 6px; width: 100%; }
  .stripe-ok     { background: var(--ok); }
  .stripe-warn   { background: var(--warn); }
  .stripe-danger { background: var(--danger); }
  .stripe-none   { background: var(--muted); }
  .card-body { padding: 16px 18px 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .card-meta .code { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--micro-dark); margin-bottom: 3px; }
  .card-meta .name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.25; }
  .semaforo { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
  .semaforo-circle {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .circle-ok     { background: var(--ok);     color: #fff; }
  .circle-warn   { background: var(--warn);   color: #fff; }
  .circle-danger { background: var(--danger); color: #fff; }
  .circle-none   { background: var(--muted);  color: #fff; }
  .semaforo-label { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .label-ok     { color: var(--ok); }
  .label-warn   { color: var(--warn); }
  .label-danger { color: var(--danger); }
  .label-none   { color: var(--muted); }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 380px) { .card-grid { grid-template-columns: 1fr; } }
  .data-cell label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 3px; }
  .data-cell .val { font-size: 14px; font-weight: 600; color: var(--text); }
  .dias-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  .dias-ok     { background: rgba(0,185,107,.12); color: var(--ok); }
  .dias-warn   { background: rgba(245,158,11,.12); color: var(--warn); }
  .dias-danger { background: rgba(229,62,62,.12);  color: var(--danger); }
  .dias-none   { background: rgba(138,180,200,.12); color: var(--muted); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  footer { margin-top: 32px; font-size: 11px; color: var(--text-soft); text-align: center; padding: 0 16px; }
</style>
</head>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQO2xlTCHWbylhgjp9Tlv-0HM6z0ZlXzh3i-VYxNgiNUwwC2g1ZZ4nLHguumRm2uTU1Ql1KV23efn7g/pub?gid=1657588836&single=true&output=csv";
let instrumentos = [];

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  return lines.map(line => {
    const cols = []; let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === "," && !inQ) { cols.push(cur.trim()); cur = ""; continue; }
      cur += c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function findHeaderRow(rows) {
  // Buscar en las primeras 30 filas
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    if (rows[i].some(c => /^CODIGO$/i.test(c.trim()))) return i;
  }
  // fallback: fila con más encabezados conocidos
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const row = rows[i].map(c => c.trim().toUpperCase());
    const hits = ["CODIGO","INSTRUMENTO","CALIBRADO","VENCIMIENTO"].filter(k => row.includes(k));
    if (hits.length >= 2) return i;
  }
  return 2;
}

function parseDate(str) {
  if (!str) return null;
  const m = str.trim().match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if (!m) return null;
  let [, d, mo, y] = m;
  if (y.length === 2) y = "20" + y;
  return new Date(+y, +mo - 1, +d);
}

function formatDate(str) {
  const d = parseDate(str);
  if (!d || isNaN(d)) return str || "—";
  return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
}

function diffDays(dateStr) {
  const d = parseDate(dateStr);
  if (!d || isNaN(d)) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((d - hoy) / 86400000);
}

function getEstado(vto, aviso) {
  const dias = diffDays(vto);
  const diasAviso = diffDays(aviso);
  if (dias === null) return { key: "none", label: "Sin datos" };
  if (dias < 0)      return { key: "danger", label: "VENCIDO" };
  if (diasAviso !== null && diasAviso <= 0) return { key: "warn", label: "Por vencer" };
  return { key: "ok", label: "APTO" };
}

async function cargarDatos() {
  document.getElementById("result").innerHTML =
    '<div class="msg"><div class="spinner"></div><p>Cargando planilla…</p></div>';
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    const rows = parseCSV(text);
    const hi = findHeaderRow(rows);
    const H = rows[hi].map(h => h.toUpperCase().trim());
    const idx = name => {
      let i = H.findIndex(h => h === name);
      if (i === -1) i = H.findIndex(h => h.includes(name));
      return i;
    };
    const iCod = idx("CODIGO"), iNom = idx("INSTRUMENTO"), iSec = idx("SECTOR");
    const iCal = idx("CALIBRADO"), iVto = idx("VENCIMIENTO"), iAvis = idx("AVISO");
    instrumentos = rows.slice(hi + 1, hi + 2001)
      .filter(r => r[iNom] && r[iNom].trim())
      .map(r => ({
        codigo:    (r[iCod]  || "").trim(),
        nombre:    (r[iNom]  || "").trim(),
        sector:    (r[iSec]  || "").trim(),
        calibrado: (r[iCal]  || "").trim(),
        vto:       (r[iVto]  || "").trim(),
        aviso:     (r[iAvis] || "").trim(),
      }));
    if (instrumentos.length === 0) {
      // Debug: mostrar qué encontró
      const hi2 = findHeaderRow(rows);
      const sample = rows.slice(0, 5).map(r => r.join(" | ")).join("\n");
      document.getElementById("result").innerHTML =
        '<div class="msg"><div class="icon">&#9888;</div><strong>Planilla cargada pero sin instrumentos detectados</strong>' +
        '<p>Fila encabezado detectada: ' + hi2 + '<br>Muestra primeras filas:<br><small style="font-family:monospace;white-space:pre;font-size:10px">' + esc(sample) + '</small></p></div>';
      return;
    }
    mostrarInicial();
    document.getElementById("buscar").focus();
  } catch(e) {
    document.getElementById("result").innerHTML =
      '<div class="msg"><div class="icon">&#9888;</div><strong>No se pudo cargar</strong><p>' + e.message + '</p></div>';
  }
}

function mostrarInicial() {
  document.getElementById("result").innerHTML =
    '<div class="msg"><div class="icon">&#128203;</div><strong>Consultá el estado de cualquier instrumento</strong><p>Ingresá el código, nombre o sector para ver<br>la aptitud de uso y fechas de calibración.</p></div>';
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderCard(inst) {
  const est = getEstado(inst.vto, inst.aviso);
  const dias = diffDays(inst.vto);
  const icons = { ok:"✓", warn:"!", danger:"✕", none:"—" };
  let diasHtml;
  if (dias !== null) {
    const cls = est.key;
    const txt = dias < 0
      ? "Venció hace " + Math.abs(dias) + " día" + (Math.abs(dias)===1?"":"s")
      : dias === 0 ? "Vence hoy"
      : dias + " día" + (dias===1?"":"s") + " restante" + (dias===1?"":"s");
    diasHtml = '<span class="dias-pill dias-' + cls + '">' + txt + '</span>';
  } else {
    diasHtml = '<span class="dias-pill dias-none">Sin fecha</span>';
  }
  return '<div class="card">' +
    '<div class="card-stripe stripe-' + est.key + '"></div>' +
    '<div class="card-body">' +
      '<div class="card-head">' +
        '<div class="card-meta">' +
          '<div class="code">' + esc(inst.codigo) + '</div>' +
          '<div class="name">' + esc(inst.nombre) + '</div>' +
        '</div>' +
        '<div class="semaforo">' +
          '<div class="semaforo-circle circle-' + est.key + '">' + icons[est.key] + '</div>' +
          '<div class="semaforo-label label-' + est.key + '">' + est.label + '</div>' +
        '</div>' +
      '</div>' +
      '<hr class="divider">' +
      '<div class="card-grid">' +
        (inst.sector ? '<div class="data-cell"><label>Sector</label><div class="val">' + esc(inst.sector) + '</div></div>' : "") +
        '<div class="data-cell"><label>Última calibración</label><div class="val">' + (formatDate(inst.calibrado)||"—") + '</div></div>' +
        '<div class="data-cell"><label>Próxima calibración</label><div class="val">' + (formatDate(inst.vto)||"—") + '</div></div>' +
        '<div class="data-cell"><label>Días restantes</label><div class="val">' + diasHtml + '</div></div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function buscar(q) {
  q = q.trim().toLowerCase();
  if (!q) { mostrarInicial(); return; }
  const found = instrumentos.filter(i =>
    i.codigo.toLowerCase().includes(q) ||
    i.nombre.toLowerCase().includes(q) ||
    i.sector.toLowerCase().includes(q)
  );
  const el = document.getElementById("result");
  if (!found.length) {
    el.innerHTML = '<div class="msg"><div class="icon">&#128269;</div><strong>Sin resultados</strong><p>No se encontró "<b>' + esc(q) + '</b>".</p></div>';
    return;
  }
  el.innerHTML = found.map(renderCard).join("");
}

let timer;
document.getElementById("buscar").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => buscar(e.target.value), 260);
});

cargarDatos();
</script>
</body>
</html>
